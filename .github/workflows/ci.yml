name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install developer dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Compile Python sources
        run: python -m compileall -q lancollab tests scripts
      - name: Run scaffold unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run mock-only contract smoke
        run: python -m scripts.mock_contract_demo
# Green scaffold tests do not imply real TCP/TLS/chat/file milestones are done.
