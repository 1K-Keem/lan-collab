name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install developer dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall -q client server common tests
      - name: Run unittest discovery
        run: python -m unittest discover -s tests -p "test_*.py"
# At scaffold time there are no implementation tests yet.
# The team must add meaningful tests before relying on CI as evidence.
